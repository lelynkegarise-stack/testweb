<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; margin: 0; padding: 0; color: #333; line-height: 1.6; }
    .container { max-width: 1000px; margin: 2rem auto; padding: 0 1rem; }
    .btn { display: inline-block; background: #003366; color: white; padding: 0.6rem 1.2rem; border-radius: 4px; text-decoration: none; margin-top: 1rem; }
  </style>
</head>
<body>

  {% include header.html %}

  <main class="container">
    {{ content }}
  </main>

  {% include footer.html %}

</body>
</html>
